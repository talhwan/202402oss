<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
	<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
</head>
<body>
    <h1>Hello! World</h1>
    <h1>안녕하세요!!</h1>
    <div id="div_test">-</div>
    <img src="img/star.jpg" width="200"/>
	<a href="https://www.daum.net">aaaaa</a>
	<a onclick="sendSMS()">sendSMS</a>
	<a onclick="share()">share</a>
	<a onclick="openUrl()">openUrl</a>
	<a onclick="getFCMToken()">test-btn</a>

<script>
	//alert("되는지 확인해봅시다.");
	function receiveFromFlutter(obj_data){
		let tempJsonData = JSON.parse(JSON.stringify(obj_data));
		let tempType = tempJsonData["type"];
        
        if(tempType === "fcmToken"){
            let tempData = tempJsonData["data"];
		    $("#div_test").html(tempData["token"]);
        }
	}
	function aaa(){
		if (window.FlutterBridge) {
		  window.FlutterBridge.postMessage(JSON.stringify({
		    action: "js_fcm",
		  	data: "testing"
		  }));
		} else {
		  console.log("FlutterBridge is not available.");
		}
	}
    
	function sendSMS(){
		if (window.FlutterBridge) {
		  window.FlutterBridge.postMessage(JSON.stringify({
		    action: "sendSMS",
		  	phone: 'talhwan@daum.net',
            body: '111222'
		  }));
		} else {
		  console.log("FlutterBridge is not available.");
		}
	}

    function share(){
		if (window.FlutterBridge) {
		  window.FlutterBridge.postMessage(JSON.stringify({
		    action: "share",
		  	content: '공유테스트\nhttps://www.daum.net',
            url: 'https://www.daum.net'
		  }));
		} else {
		  console.log("FlutterBridge is not available.");
		}
	}

    
    function openUrl(){
		if (window.FlutterBridge) {
		  window.FlutterBridge.postMessage(JSON.stringify({
		    action: "openUrl",
            url: 'https://www.daum.net'
		  }));
		} else {
		  console.log("FlutterBridge is not available.");
		}
	}

    
	function getFCMToken(){
		if (window.FlutterBridge) {
		  window.FlutterBridge.postMessage(JSON.stringify({
		    action: "getFCMToken"
		  }));
		} else {
		  console.log("FlutterBridge is not available.");
		}
	}
</script>
    
</body>
</html>
